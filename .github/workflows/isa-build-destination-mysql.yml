# Baut den gepatchten destination-mysql Connector (Fix für Texte > 512 Zeichen)
# und legt das Image in GitHub Packages (ghcr.io) ab.
# Start: Actions -> "ISA: Build destination-mysql" -> Run workflow
name: "ISA: Build destination-mysql"

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch mit dem Fix"
        default: "fix/destination-mysql-long-strings"
        required: true
      tag:
        description: "Image-Tag"
        default: "1.1.3-isa"
        required: true

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      CONNECTOR: destination-mysql
      IMAGE: ghcr.io/${{ github.repository_owner }}/destination-mysql
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}

      - name: Base image aus metadata.yaml lesen
        id: vars
        run: |
          base_image="$(yq '.data.connectorBuildOptions.baseImage' airbyte-integrations/connectors/${CONNECTOR}/metadata.yaml)"
          echo "base-image=${base_image}" | tee -a "${GITHUB_OUTPUT}"

      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Connector bauen (Tarball)
        run: ./gradlew :airbyte-integrations:connectors:${CONNECTOR}:distTar

      - name: Bei ghcr.io anmelden
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Image bauen und hochladen
        uses: docker/build-push-action@v6
        with:
          context: airbyte-integrations/connectors/${{ env.CONNECTOR }}
          file: docker-images/Dockerfile.java-connector
          platforms: linux/amd64
          tags: ${{ env.IMAGE }}:${{ inputs.tag }}
          build-args: |
            BASE_IMAGE=${{ steps.vars.outputs.base-image }}
            CONNECTOR_NAME=${{ env.CONNECTOR }}
          push: true

      - name: Image testen (spec)
        run: docker run --rm ${IMAGE}:${{ inputs.tag }} spec | head -c 500
